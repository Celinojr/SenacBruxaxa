<!DOCTYPE html>
<html>
<head>
<title>Editar</title>

<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">

</head>
<body>

<div class="topo">

    <img src="{{ url_for('static', filename='logo.png') }}" class="logo">

    <h1>Sistema de Hotelaria</h1>

</div>

<h1>Editar Hóspede</h1>

<form action="/atualizar/{{ hospede[0] }}" method="post">

Nome:<br>
<input type="text" name="nome" value="{{ hospede[1] }}" required>

<br><br>

CPF:<br>
<input type="text" name="cpf" value="{{ hospede[2] }}" required>

<br><br>

Telefone:<br>
<input type="text" name="telefone" value="{{ hospede[3] }}" required>

<br><br>

Email:<br>
<input type="email" name="email">

<br><br>

Cidade:<br>
<input type="text" name="cidade">

<br><br>

Quarto:<br>
<input type="text" name="quarto" value="{{ hospede[4] }}" required>

<br><br>

Entrada:<br>
<input type="date" name="entrada" value="{{ hospede[5] }}" required>

<br><br>

Saída:<br>
<input type="date" name="saida" value="{{ hospede[6] }}" required>

<br><br>

Diária:<br>
<input type="number" step="0.01" name="diaria" value="{{ hospede[7] }}" required>

<br><br>

Observações:<br>
<textarea name="observacoes"></textarea>

<br><br>

<button type="submit">
Atualizar
</button>

<a href="/lista">
<button type="button">
Voltar
</button>
</a>

</form>

<div class="rodape">

Sistema desenvolvido para fins educacionais — SENAC

</div>

</body>
</html>
